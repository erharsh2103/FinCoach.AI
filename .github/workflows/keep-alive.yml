name: Keep-alive ping

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health (keeps Render awake)
        run: curl -fsS --max-time 20 "${{ vars.BACKEND_URL }}/api/health"

      - name: Ping backend DB health (keeps Supabase active)
        run: curl -fsS --max-time 20 "${{ vars.BACKEND_URL }}/api/health/db"
